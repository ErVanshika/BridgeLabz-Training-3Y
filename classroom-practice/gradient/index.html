<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        .container{
            width: 400px;
            height: 500px;
            border: 1px solid red;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            width: 200px;
            height: 300px;
            border: 1px solid black;
            /*background-color:rgb(255, 192, 215) ;*/
            text-align: center;
           /* box-shadow: -10px -20px 20px pink, 10px 10px 10px plum ;*/
          /* background-image: repeating-linear-gradient(125deg,rgb(149, 99, 149) 0% 20%,pink 20% 40%); to right,90 deg,to right bottom,0 deg ,red 0% 20% ,blue 40% 100%,repeating linear gradient  */
           background-image:repeating-radial-gradient(pink 0% 20%,rgb(188, 116, 188) 20% 40%);
         /* transition-property: transform   ;
          transition-duration:2s ; 
          transition-timing-function:ease ;*/
          transition: transform 1s ease ;
     
       
        }
        .card:hover{
             box-shadow: -10px -20px 20px pink, 10px 10px 10px plum ;
             /*transform: translateY(-30px);*/
             /*transform: scale(1.1);*/

            transform: rotate(360deg);
        }
    </style>
    
</head>
<body>
    <h1> Gradient,box-shadow, transition,hover effect </h1>
    <div class="container">
         <div class="card">
            <h2> Profile </h2>
         </div>
    </div>
    
</body>
</html>
