
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Manipulation Report</title>
</head>
<body>
    <h2>String Manipulation Report</h2>

    <button onclick="formatProduct()">Format Product Name</button>

    <p id="result"></p>

    <script>
        function formatProduct() {
            let productName = " wireless headphones PRO ";

            let cleanedName = productName.trim().toLowerCase();

            cleanedName = cleanedName
                .split(" ")
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(" ");

            cleanedName = cleanedName.replace("Pro", "Pro Edition");

            document.getElementById("result").innerHTML =
                "Original Name: " + productName +
                "<br>Cleaned Title: " + cleanedName +
                "<br>Title Length: " + cleanedName.length;

            console.log("Cleaned Title:", cleanedName);
            console.log("Title Length:", cleanedName.length);
        }
    </script>
</body>
</html>
