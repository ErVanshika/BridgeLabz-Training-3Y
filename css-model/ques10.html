<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f4f4f4;
        }

        nav {
            background-color: #222;
            padding: 15px 30px;
            border-bottom: 3px solid #6c63ff;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            align-items: center;
            list-style: none;
            gap: 10px;
        }

        .nav-links a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border: 2px solid transparent;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background-color: #6c63ff;
            border-color: white;
            transform: translateY(-2px);
        }

        .nav-links .active {
            background-color: #6c63ff;
            border-bottom: 3px solid white;
        }

        .content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        .content-box {
            max-width: 700px;
        }

        .content h1 {
            font-size: 42px;
            color: #333;
            margin-bottom: 15px;
        }

        .content p {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            border-top: 3px solid #6c63ff;
        }

        @media (max-width: 700px) {
            .nav-links {
                flex-direction: column;
                width: 100%;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                text-align: center;
                width: 100%;
            }

            nav {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main class="content">
        <div class="content-box">
            <h1>Welcome to My Website</h1>
            <p>
                This navigation bar demonstrates CSS padding, borders,
                transitions, hover effects, active styling, and responsive design.
            </p>
        </div>
    </main>

    <footer>
        <p>© 2026 My Website | All Rights Reserved
```
