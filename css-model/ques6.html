<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin-bottom: 50px;
            color: #333;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .item {
            text-align: center;
        }

        .box {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #6c63ff;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            transition: all 0.4s ease;
        }

        .rotate:hover {
            transform: rotate(45deg);
        }

        .scale:hover {
            transform: scale(1.3);
        }

        .translate:hover {
            transform: translate(30px, -20px);
        }

        .skew:hover {
            transform: skew(20deg);
        }

        .item p {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <h1>CSS Transformations Showcase</h1>

    <div class="container">

        <div class="item">
            <div class="box rotate">Rotate</div>
            <p>rotate()</p>
        </div>

        <div class="item">
            <div class="box scale">Scale</div>
            <p>scale()</p>
        </div>

        <div class="item">
            <div class="box translate">Translate</div>
            <p>translate()</p>
        </div>

        <div class="item">
            <div class="box skew">Skew</div>
            <p>skew()</p>
        </div>

    </div>

</body>
</html>
