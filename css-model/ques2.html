<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Height and Width Practice</title>

    <style>

        
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        
        .container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 30px;
            flex-wrap: wrap;
        }

        
        .box {
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        
        .box1 {
            width: 250px;
            height: 200px;

            background-color: lightcoral;
        }

        
        .box2 {
            width: 30%;
            height: 30vh;

            background-color: lightseagreen;

            min-height: 180px;
            max-width: 350px;
        }

        
        .box3 {
            width: 18em;
            height: 12em;

            background-color: lightskyblue;

            overflow: auto;
        }

        
        .box3 p {
            line-height: 1.6;
        }

    
        h1 {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
        }

    </style>
</head>

<body>

    <h1>Height and Width Practice</h1>
