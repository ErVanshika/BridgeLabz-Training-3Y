<!DOCTYPE html>
<html>
<head>
    <title>Data Type Summary</title>
</head>
<body>

    <h2>Multi-Type Data Summary</h2>
    <p>Open the browser console to see the report.</p>

    <script>
        let name = "Vanshika";
        let age = 20;
        let isStudent = true;
        let subjects = ["Java", "HTML", "JavaScript"];
        let user = { name: "Vanshika", age: 20 };
        let address = null;
        let marks;

        console.table([
            { Label: "Name", Value: name, Type: typeof name },
            { Label: "Age", Value: age, Type: typeof age },
            { Label: "Is Student", Value: isStudent, Type: typeof isStudent },
            { Label: "Subjects", Value: subjects, Type: Array.isArray(subjects) ? "array" : typeof subjects },
            { Label: "User", Value: JSON.stringify(user), Type: typeof user },
            { Label: "Address", Value: address, Type: "null" },
            { Label: "Marks", Value: marks, Type: typeof marks }
        ]);
    </script>

</body>
</html>
