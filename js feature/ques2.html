
<!DOCTYPE html>
<html>
<head>
    <title>Employee Bonus Calculator</title>
</head>
<body>
    <h2>Employee Bonus Calculator</h2>
    <pre id="output"></pre>

    <script>
        "use strict";

        const employees = [
            { name: "Amit", salary: "45000", years: "5" },
            { name: "Sara", salary: "38000", years: "2" },
            { name: "Kiran", salary: "52000", years: "7" }
        ];

        let report = "";

        try {
            for (let employee of employees) {
                if (
                    !employee.name ||
                    employee.salary === undefined ||
                    employee.years === undefined
                ) {
                    throw new Error("Missing employee property");
                }

                let salary = Number(employee.salary);
                let years = Number(employee.years);

                if (!Number.isFinite(salary) || !Number.isFinite(years)) {
                    throw new Error("Invalid salary or years for " + employee.name);
                }

                let bonus;

                if (years > 3) {
                    bonus = salary * 0.10;
                } else {
                    bonus = salary * 0.05;
                }

                let totalSalary = salary + bonus;

                report += `Employee: ${employee.name}\n`;
                report += `Salary: ₹${salary}\n`;
                report += `Years of Experience: ${years}\n`;
                report += `Bonus: ₹${bonus.toFixed(2)}\n`;
                report += `Total Salary: ₹${totalSalary.toFixed(2)}\n`;
                report += "--------------------------\n";
            }
        } catch (error) {
            report += `Error: ${error.message}`;
            console.error(error.message);
        }

        document.getElementById("output").textContent = report;
        console.log(report);
    </script>
</body>
</html>
