
<!DOCTYPE html>
<html>
<head>
    <title>Transaction Validator</title>
</head>
<body>
    <h2>Transaction Validator</h2>
    <pre id="output"></pre>

    <script>
        "use strict";

        const transactions = [
            { id: 1, amount: 2000 },
            { id: 2, amount: -500 },
            { id: 3 },
            null
        ];

        let valid = [];
        let invalid = [];
        let report = "";

        for (let transaction of transactions) {
            try {
                if (transaction === null) {
                    throw new Error("NULL_ENTRY");
                }

                if (transaction.id === undefined || transaction.amount === undefined) {
                    throw new Error("MISSING_PROPERTY");
                }

                if (transaction.amount < 0) {
                    throw new Error("NEGATIVE_AMOUNT");
                }

                valid.push(transaction);
                report += `Transaction ${transaction.id}: Valid\n`;
            } catch (error) {
                let reason = error.message;

                if (reason === "NULL_ENTRY") {
                    invalid.push({ transaction, reason: "Null entry" });
                } else if (reason === "MISSING_PROPERTY") {
                    invalid.push({ transaction, reason: "Missing amount or id" });
                } else if (reason === "NEGATIVE_AMOUNT") {
                    invalid.push({ transaction, reason: "Negative amount" });
                }

                report += `Invalid Transaction: ${reason}\n`;
            }
        }

        report += "\n========== FINAL REPORT ==========\n";
        report += `Successful Transactions: ${valid.length}\n`;
        report += `Failed Transactions: ${invalid.length}\n`;

        report += "\nValid Transactions:\n";
        for (let transaction of valid) {
            report += `ID: ${transaction.id}, Amount: ₹${transaction.amount}\n`;
        }

        report += "\nInvalid Transactions:\n";
        for (let transaction of invalid) {
            report += `${transaction.reason}\n`;
        }

        document.getElementById("output").textContent = report;
        console.log("Valid Transactions:", valid);
        console.log("Invalid Transactions:", invalid);
    </script>
</body>
</html>
