```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 40px 5%;
        }

        h1 {
            margin-bottom: 30px;
        }

        .map-container {
            width: 90%;
            height: 500px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <h1>My City - Mathura</h1>

    <div class="map-container">

        <iframe
            src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh,India&output=embed"
            title="Google Map showing Mathura, Uttar Pradesh"
            width="100%"
            height="100%"
            loading="lazy">
        </iframe>

    </div>

</body>
</html>
```
