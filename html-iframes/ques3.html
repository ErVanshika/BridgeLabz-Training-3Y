```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Iframes</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .iframe-container {
            width: 90%;
            margin: auto;
        }

        iframe {
            display: block;
            width: 100%;
            height: 300px;
            margin-bottom: 25px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: white;
        }
    </style>
</head>

<body>

    <h1>My Introduction and Hobby</h1>

    <div class="iframe-container">

        <iframe
            src="introduction.html"
            title="My Introduction"
            width="100%"
            height="300">
        </iframe>

        <iframe
            src="hobby.html"
            title="My Favorite Hobby"
            width="100%"
            height="300">
        </iframe>

    </div>

</body>
</html>
```
