```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        figure {
            position: relative;
            overflow: hidden;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .image-box {
            position: relative;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .image-box::after {
            content: "";
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.45);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        figure:hover .image-box img {
            transform: scale(1.1);
        }

        figure:hover .image-box::after {
            opacity: 1;
        }

        figcaption {
            padding: 15px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            color: #333;
            background-color: white;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .image-box img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <h1>Image Showcase</h1>

    <p class="intro">
        Hover over an image to see the scale and overlay effect.
    </p>

    <div class="gallery">

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1015/600/400" alt="Mountain landscape">
            </div>
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1016/600/400" alt="Beautiful nature">
            </div>
            <figcaption>Beautiful Nature</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1018/600/400" alt="Forest landscape">
            </div>
            <figcaption>Forest View</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1019/600/400" alt="Lake landscape">
            </div>
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1020/600/400" alt="Wildlife">
            </div>
            <figcaption>Wildlife</figcaption>
        </figure>

        <figure>
            <div class="image-box">
                <img src="https://picsum.photos/id/1024/600/400" alt="Cute animal">
            </div>
            <figcaption>Animal Portrait</figcaption>
        </figure>

    </div>

</body>
</html>
