```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            margin-bottom: 40px;
        }

        .examples {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        .tooltip-box {
            position: relative;
            display: inline-block;
        }

        .element {
            display: inline-block;
            padding: 18px 25px;
            background-color: #4f46e5;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-bottom: 12px;
            background-color: #222;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease-in-out;
        }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #222 transparent transparent transparent;
        }

        .tooltip-box:hover .tooltip {
            opacity: 1;
            visibility: visible;
        }

        .element:hover {
            background-color: #3730a3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>CSS Tooltip Demonstration</h1>

        <p class="description">
            Move your mouse over each element to see the tooltip.
        </p>

        <div class="examples">

            <div class="tooltip-box">
                <div class="element">HTML</div>
                <div class="tooltip">Structure of a webpage</div>
            </div>

            <div class="tooltip-box">
                <div class="element">CSS</div>
                <div class="tooltip">Styles a webpage</div>
            </div>

            <div class="tooltip-box">
                <div class="element">JavaScript</div>
                <div class="tooltip">Adds interactivity</div>
            </div>

            <div class="tooltip-box">
                <div class="element">Flexbox</div>
                <div class="tooltip">Creates flexible layouts</div>
            </div>

        </div>

    </div>

</body>
</html>
```
