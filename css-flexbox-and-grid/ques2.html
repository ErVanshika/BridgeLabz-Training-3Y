<!DOCTYPE html>
<html>
<head>
    <title>Product Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        /* Product Grid */
        .product-gallery {
            display: grid;

            /* 4 columns on desktop */
            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
            padding: 20px;
        }

        /* Product Card */
        .product-card {
            background-color: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;

            /* Equal height */
            min-height: 180px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            /* Hover transition */
            transition: 0.3s;
        }

        /* Hover Effect */
        .product-card:hover {
            transform: scale(1.05);
        }

        .product-card h2 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        /* Tablet: 2 columns */
        @media (max-width: 900px) {
            .product-gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile: 1 column */
        @media (max-width: 600px) {
            .product-gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Product Gallery</h1>

    <div class="product-gallery">

        <div class="product-card">
            <h2>Laptop</h2>
            <p class="price">₹55,000</p>
        </div>
