<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            margin: 30px;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;

            /* Automatically adjusts columns */
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;
            padding: 20px;
        }

        /* Figure */
        figure {
            margin: 0;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        /* Image */
        figure img {
            width: 100%;
            height: 250px;

            /* Image fills the grid cell */
            object-fit: cover;

            display: block;

            /* Smooth zoom */
            transition: transform 0.5s ease;
        }

        /* Hover Effect */
        figure img:hover {
            transform: scale(1.05);
        }

        /* Caption */
        figcaption {
            text-align: center;
            padding: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <figure>
            <img src="https://picsum.photos/id/1015/500/300"
                 alt="Mountain">

        </figure>

</body>
