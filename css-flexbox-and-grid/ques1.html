```html
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #333;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        /* Main */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px;
        }

        .about {
            width: 50%;
            text-align: center;
        }

        .image-section {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-section img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Responsive Design */
        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-direction: column;
                align-items: center;
            }

            main {
                flex-direction: column;
            }

            .about,
            .image-section {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Vanshika Sharma</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <section class="about">
            <h2>About Me</h2>

            <p>
                Hello! I am Vanshika Sharma, a B.Tech student
                interested in web development and programming.
                I enjoy learning new technologies and creating
                simple and useful websites.
            </p>
        </section>

        <section class="image-section">
            <img src="https://via.placeholder.com/250"
                 alt="Profile Image">
        </section>

    </main>

    <footer>
        <p>© 2026 Vanshika Sharma. All Rights Reserved.</p>
    </footer>

</body>
</html>
