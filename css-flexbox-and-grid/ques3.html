```html
<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Makes footer stay at bottom */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #333;
            color: white;
            padding: 20px;

            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        nav {
            width: 100%;
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* Main */
        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 30px;
            padding: 40px;
        }

        /* Three Boxes */
        .box {
            flex: 1;
            min-height: 200px;

            background-color: #f2f2f2;
            border: 2px solid #333;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
            font-weight: bold;

            /* Smooth rotation */
            transition: 0.3s;
        }

        /* Hover Effect */
        .box:hover {
            transform: rotate(2deg);
        }

        /* Footer */
        footer {
            width: 100%;
            background-color: #333;
            color: white;

            text-align: center;
            padding: 15px;
        }

        /* Responsive Design */
        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }

            .box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>


    <!-- Main -->
    <main>

        <div class="box">
            Services
        </div>

        <div class="box">
            Projects
        </div>

        <div class="box">
            Contact
        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 My Homepage. All Rights Reserved.</p>
    </footer>

</body>
</html>
```
