<!DOCTYPE html>
<html>
<head>
    <title>Loading Animation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            /* Center animation horizontally and vertically */
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f2f2f2;
        }

        /* Loading container */
        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Circles */
        .circle {
            width: 15px;
            height: 15px;

            background-color: #333;
            border-radius: 50%;

            /* Animation */
            animation-name: bounce;
            animation-duration: 0.8s;
            animation-iteration-count: infinite;
        }

        /* Delay for second circle */
        .circle:nth-child(2) {
            animation-delay: 0.2s;
        }

        /* Delay for third circle */
        .circle:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Animation */
        @keyframes bounce {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="loader">

        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>

    </div>

</body>
</html>
