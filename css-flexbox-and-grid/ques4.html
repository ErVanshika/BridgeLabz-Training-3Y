```html
<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main Dashboard Grid */
        .dashboard {
            min-height: 100vh;

            display: grid;

            /* Sidebar + Main Content */
            grid-template-columns: 1fr 3fr;

            /* Header + Content */
            grid-template-rows: 80px 1fr;

            grid-gap: 20px;
            padding: 20px;
        }

        /* Header */
        header {
            grid-column: 1 / -1;

            background-color: #333;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
        }

        /* Sidebar */
        aside {
            background-color: white;
            padding: 20px;

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        aside a {
            text-decoration: none;
            color: #333;
            padding: 10px;
            border-radius: 5px;
        }

        aside a:hover {
            background-color: #ddd;
        }

        /* Main Content */
        main {
            display: grid;

            /* 2 equal columns */
            grid-template-columns: repeat(2, 1fr);

            gap: 20px;
        }

        /* Dashboard Boxes */
        .box {
            background-color: white;
            min-height: 180px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 10px;

            font-size: 22px;
            font-weight: bold;

            transition: 0.3s;
        }

        /* Box spanning two columns */
        .box:first-child {
            grid-column: span 2;
        }

        /* Hover Effect */
        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 700px) {

            .dashboard {
                grid-template-columns: 1fr;
            }

            header {
                grid-column: 1;
            }

            main {
                grid-template-columns: 1fr;
            }

            .box:first-child {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header>
            My Dashboard
        </header>

        <!-- Sidebar -->
        <aside>
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Projects</a>
            <a href="#">Settings</a>
            <a href="#">Logout</a>
        </aside>

        <!-- Main Content -->
        <main>

            <div class="box">
                Total Users
            </div>

            <div class="box">
                Sales
            </div>

            <div class="box">
                Orders
            </div>

            <div class="box">
                Revenue
            </div>

        </main>

    </div>

</body>
</html>
